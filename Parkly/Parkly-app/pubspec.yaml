name: parkly
description: "Parcheaza repede si ieftin"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.1.0
  
  cloud_firestore: ^5.0.1
  
  firebase_auth: ^5.7.0
  firebase_crashlytics: ^4.2.5
  firebase_messaging: ^15.2.10
  flutter_local_notifications: ^18.0.1

  google_maps_flutter: ^2.10.1

  geolocator: ^14.0.2
  geocoding: ^3.0.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4

  google_sign_in: ^6.2.1
  intl: ^0.19.0
  url_launcher: ^6.3.1
  firebase_storage: ^12.4.10
  package_info_plus: ^9.0.1
  shared_preferences: ^2.5.5
  app_settings: ^7.0.0
  pdf: ^3.12.0
  printing: ^5.14.3
  timezone: ^0.9.4
  firebase_app_check: ^0.3.2+10
  flutter_markdown: ^0.7.7+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
  firebase_auth_mocks: ^0.14.2
  fake_cloud_firestore: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - lib/assets/main.jpeg
    - lib/assets/logo.png


dependency_overrides:
  geolocator_android: 4.6.2
